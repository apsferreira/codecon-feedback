name: Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - '**.md'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}

      - name: Set image tag
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ghcr.io/apsferreira/voteai-backend:${{ steps.vars.outputs.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: ghcr.io/apsferreira/voteai-frontend:${{ steps.vars.outputs.sha }}

      - name: Update K8s manifests with new image tags
        run: |
          sed -i "s|image: ghcr.io/apsferreira/voteai-backend:.*|image: ghcr.io/apsferreira/voteai-backend:${{ steps.vars.outputs.sha }}|g" k8s/backend-deployment.yaml
          sed -i "s|image: ghcr.io/apsferreira/voteai-frontend:.*|image: ghcr.io/apsferreira/voteai-frontend:${{ steps.vars.outputs.sha }}|g" k8s/frontend-deployment.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/backend-deployment.yaml k8s/frontend-deployment.yaml
          git diff --cached --quiet || git commit -m "ci: atualiza imagens para ${{ steps.vars.outputs.sha }}"
          git push
