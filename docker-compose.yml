services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voteai
      POSTGRES_USER: voteai
      POSTGRES_PASSWORD: voteai
    ports:
      - "5432:5432"
    volumes:
      - voteai-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voteai -d voteai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://voteai:voteai@db:5432/voteai?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./migrations:/app/migrations
    working_dir: /app

  frontend:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  voteai-db-data:
  frontend-node-modules:
