apiVersion: apps/v1
kind: Deployment
metadata:
  name: voteai-backend
  namespace: codecon
  labels:
    app: voteai-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voteai-backend
  template:
    metadata:
      labels:
        app: voteai-backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: backend
          image: ghcr.io/apsferreira/voteai-backend:fbb7ed0
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: voteai-backend-secrets
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: voteai-backend
  namespace: codecon
spec:
  selector:
    app: voteai-backend
  ports:
    - port: 3000
      targetPort: 3000
